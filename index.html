<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Yayasan Orang Tua Asuh (YOTA) — lembaga sosial yang bergerak dalam pendampingan anak asuh, program donasi, dan penyaluran bantuan secara transparan.">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://app.sandbox.midtrans.com">

    <!--
      Preload fonts: break the critical chain HTML → CSS → font file.
      Without preload the browser can't discover the font until it has
      downloaded and parsed the CSS, causing a FOIT that blocks FCP.
      With preload the font download starts in parallel with the CSS.
      'as=font' + 'crossorigin' are required for correct cache behaviour.
    -->
    <link href="/src/assets/fonts/poppins.medium.ttf">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <title>Yota - Yayasan Orang Tua Asuh</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
