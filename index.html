<html lang="id">
  <head>

    <link rel="icon" href="/favicon.ico">
    <!-- Preconnect to API and Midtrans to start DNS/TLS early -->

    <!-- async: loads in parallel, does NOT block HTML parsing or Vue app mount -->

      async

      data-client-key="%VITE_MIDTRANS_CLIENT_KEY%"
    ></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
